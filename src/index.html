<!DOCTYPE html>
<html lang="en" x-data="app()" x-init="init()" class="scroll-smooth dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />


  <meta property="og:title" content="Gianfranco - Full Stack Developer" />
  <meta property="og:description" content="I design and build digital products that people love to use." />
  <meta property="og:type" content="website" />

  <title>Gianfranco — Full Stack Developer</title>

  

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=PT+Sans:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

</head>

<body>
  <app-root></app-root>
  

  <script>
    function app() {
      return {
        dark: false,
        mm: false,
        sc: false,
        s: 'hero',

        init() {
          // dark mode
          this.dark = localStorage.getItem('theme') === 'dark' ||
            (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
          this.$watch('dark', v => localStorage.setItem('theme', v ? 'dark' : 'light'));
          
          // reveal
          const io = new IntersectionObserver(entries => {
            entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
          }, { threshold: 0.1, rootMargin: '0px 0px -40px 0px' });
          document.querySelectorAll('.reveal').forEach(el => io.observe(el));

          // year

          const yr = document.getElementById('yr');
          if (yr) {
            yr.textContent = new Date().getFullYear();
          }
        },

      }
    }
  </script>

</body>

</html>
